name: ci

on:
  push:
    # claude/** so an autonomous branch gets the macOS Swift job — the only compiler
    # those sessions have — before a PR exists.
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fastest gate, so it runs first and everything else depends on it. A failure here means
  # someone hand-edited a generated file — possibly one that defines what may leave the
  # user's machine.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: regenerate everything from the specs
        run: make gen
      - name: fail if anything changed
        run: |
          if ! git diff --exit-code; then
            echo ""
            echo "Generated files are stale. Run 'make gen' and commit the result."
            exit 1
          fi

  # The Python reference implementations and the fixtures they generate must agree with
  # what is committed. If this fails, someone changed a rule in one place — the reference,
  # the fixtures, or (via the Swift fixture tests) the engine — and not the others.
  reference:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: boundary fixtures are what the reference produces
        run: |
          python3 scripts/gen_boundary_fixtures.py
          git diff --exit-code -- spec/fixtures/boundaries
      - name: analysis package unit tests
        run: |
          if [ -d analysis/tests ]; then python3 -m unittest discover -s analysis/tests -t . -v; fi
          python3 -m analysis stats spec/fixtures/boundaries/remote_sdk_prompts.jsonl > /dev/null
      - name: capture package tests
        # The cloud uploader (docs/cloud-capture.md) is held to the same boundary fixtures
        # and to the upload contract; stdlib only, so nothing to install.
        run: make capture-test

  swift:
    needs: contract
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        # No simulator, no xcodebuild, no signing — the whole engine is a SwiftPM package,
        # which is why this job is ~60s and needs no certificates.
        run: swift test --package-path Packages/BuilderKit
      - name: build the app bundle
        run: ./scripts/make_app.sh

  mobile:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - working-directory: mobile
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: mobile
        run: bunx tsc --noEmit
      - name: strip conformance
        working-directory: mobile
        # Decodes the same golden fixtures the Swift suite does. Without this the phone and
        # the Mac can disagree about what a session looked like while both appear to work.
        run: bun test

  backend:
    needs: contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: builder_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - working-directory: server
        # ruff is pinned: `ruff format --check` drifts between releases, and an unpinned
        # install turns a formatter upgrade into a red main with no code change.
        run: pip install -r requirements.txt "ruff==0.16.6" pytest
      - name: lint
        working-directory: server
        run: ruff check . && ruff format --check .
      - name: migrate
        working-directory: server
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost/builder_test
        run: |
          alembic upgrade head
          # Round-trip, then re-apply. `alembic check` cannot run here — it diffs against
          # SQLAlchemy metadata and this schema is raw SQL with target_metadata=None, so it
          # failed unconditionally. What we actually want proven is that every revision
          # has a working downgrade and that re-running `upgrade head` on a migrated
          # database is a no-op, which is what a redeploy of the same revision does.
          alembic downgrade base
          alembic upgrade head
          alembic upgrade head
      - name: grant the test role a login
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d builder_test -c "ALTER ROLE builder_app LOGIN PASSWORD 'postgres';"
      - name: test
        working-directory: server
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost/builder_test
          BUILDER_TEST_DB: postgresql+psycopg://postgres:postgres@localhost/builder_test
        run: pytest -q

  # NOT here yet: an `xcode` job building the iOS or macOS app targets. It is added after
  # the first successful TestFlight submission, because until the signing chain is proven
  # by hand a CI failure teaches nothing about whether the app can actually ship.
