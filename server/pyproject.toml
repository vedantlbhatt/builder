[project]
name = "builder-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "httpx>=0.27",
  "redis>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff==0.16.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
# builder/contract.py and builder/analysis_spec.py are GENERATED (scripts/gen_contract.py
# and scripts/gen_analysis.py). Style rules do not apply to generated output, and
# hand-editing it to satisfy them is exactly what CI forbids.
extend-exclude = ["builder/contract.py", "builder/analysis_spec.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is a function call in a default argument by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest` from server/ must import the `builder` package without an install step.
# Without this, bare `pytest` puts tests/ on sys.path and nothing else, and every module
# fails at collection with ModuleNotFoundError — which is what CI was doing.
pythonpath = ["."]
